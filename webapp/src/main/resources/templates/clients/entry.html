<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title th:text="#{page.header.title}">Earthly</title>
  <th:block th:replace="parts/static::head"></th:block>
</head>
<body class="sidebar-mini layout-fixed" style="height: auto">
<div class="app-wrapper">
  <th:block th:replace="parts/template::header"></th:block>
  <th:block th:replace="parts/template::navigation"></th:block>

  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 th:text="#{page.title.client.entry}">OAuthクライアント追加</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{page.title.home}">Home</a></li>
              <li class="breadcrumb-item"><a th:href="@{/users}" th:text="#{page.title.client.list}">OAuthクライアントリスト</a>
              </li>
              <li class="breadcrumb-item active" th:text="#{page.title.client.entry}">OAuthクライアント追加</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="alert alert-danger alert-dismissible fade show" th:if="${errorCode}">
        <i class="fas fa-exclamation-triangle me-1"></i>
        <th:block th:text="${#messages.msgOrNullWithParams(errorCode.messageKey, messageArgs)}"></th:block>
      </div>
      <form method="post" class="form-horizontal entry" th:action="@{/clients/entries}" th:object="${OAuthClientEntryForm}">
        <div class="form-group row m-1">
          <label class="col-sm-2 col-form-label" for="name" th:text="#{page.label.client.name}">OAuthクライアント名</label>
          <div class="col-sm-9">
            <input class="form-control" id="name" th:classappend="${#fields.hasErrors('name')}?'is-invalid'"
                   th:field="*{name}" th:readonly="${readOnly}" type="text">
            <div class="invalid-feedback" th:errors="*{name}" th:if="${#fields.hasErrors('name')}">
              OAuthクライアント名は必須です。
            </div>
          </div>
        </div>
        <div class="form-group row m-1">
          <label class="col-sm-2 form-label" for="scope" th:text="#{page.label.client.scope}">スコープ</label>
          <div class="col-sm-9">
              <select id="scope" name="scope" class="form-control" multiple="multiple" th:disabled="${readOnly}"
                      th:classappend="${#fields.hasErrors('scope')}?'is-invalid'" style="width: 100%">
                <th:block th:if="${#lists.isEmpty(OAuthClientEntryForm.scope())}">
                  <option th:each="scope : ${T(jp.co.project.planets.earthly.schema.emuns.Scope).values()}"
                          th:text="${scope.name()}" th:value="${scope.id}"></option>
                </th:block>
                <th:block th:unless="${#lists.isEmpty(OAuthClientEntryForm.scope())}">
                  <option th:each="scope : ${T(jp.co.project.planets.earthly.schema.emuns.Scope).values()}"
                          th:selected="${#lists.contains(OAuthClientEntryForm.scope(),scope.id)}" th:text="${scope.name()}"
                          th:value="${scope.id}"></option>
                </th:block>
              </select>
              <div class="invalid-feedback" th:errors="*{scope}" th:if="${#fields.hasErrors('scope')}">
                スコープは必須です。
              </div>
          </div>
        </div>
        <div class="row m-1 text-center justify-content-end">
          <button type="button" class="btn btn-secondary mr-1" data-target="#cancel" data-toggle="modal"
                  th:text="#{page.button.back}">戻る
          </button>
          <button type="submit" class="btn btn-primary" th:text="#{page.button.confirm}">確認</button>
        </div>
      </form>
    </section>
  </div>
</div>
</body>
<div th:replace="clients/modal::entry(${OAuthClientEntryForm})"></div>
<div th:replace="clients/modal::cancel"></div>
<th:block th:replace="parts/template::footer"></th:block>
<th:block th:replace="parts/static::bottom"></th:block>
<script th:src="@{/js/client.js}"></script>
<script th:replace="parts/badge::notice"></script>
<script th:inline="javascript" type="text/javascript">
    $('#scope').select2({
        width: 'resolve'
    });
</script>
<script th:inline="javascript" th:if="${readOnly}">
    $(function () {
        $('#entry').modal('show')
    });
    $('#entry').on('hidden.bs.modal', function (e) {
        const form = $('form.entry');
        form.find('input').each((i, e) => {
            e.readOnly = false;
        });
        form.find('select').each((i, e) => {
            e.disabled = false;
        });
    });
</script>
</html>
