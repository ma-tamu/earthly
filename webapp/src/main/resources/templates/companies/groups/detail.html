<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Earthly</title>
  <th:block th:replace="parts/static::head"></th:block>
</head>
<body class="sidebar-mini layout-fixed" style="height: auto">
<div class="app-wrapper">
  <th:block th:replace="parts/template::header"></th:block>
  <th:block th:replace="parts/template::navigation"></th:block>

  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 th:text="#{page.title.company.group.detail}">グループ詳細</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{page.title.home}">Home</a></li>
              <li class="breadcrumb-item"><a th:href="@{/companies}" th:text="#{page.title.company.list}">会社リスト</a>
              </li>
              <li class="breadcrumb-item"><a th:href="@{/companies/__${group.company.id}__}" th:text="${group.company.name}">会社名</a></li>
              <li class="breadcrumb-item active"><th:block th:text="${group.name}"/></li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <!-- Default box -->
      <div class="card card-primary card-outline">
        <div class="card-header">
          <h3 class="card-title" th:text="${group.name}">会社名</h3>
          <div class="card-tools">
            <button type="button" class="btn btn-sm btn-primary edit" th:title="#{page.button.title.edit}"
                    data-target="#edit" data-toggle="modal">
              <i class="fas fa-user-edit"></i>
            </button>
            <button type="button" class="btn btn-sm btn-danger delete" th:title="#{page.button.title.delete}"
                    data-target="#delete" data-toggle="modal">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
        <!-- /.card-footer-->
      </div>
      <!-- /.card -->
      <hr>

      <!-- 所属ユーザーリスト -->
      <div class="card card-primary card-outline">
        <div class="card-header">
          <h3 class="card-title" th:text="#{page.label.company.group.belong.user.list}">所属ユーザーリスト</h3>
          <div class="card-tools">
            <button type="button" class="btn btn-sm btn-primary add-belong-user"
                    th:title="#{page.button.title.assign}" data-target="#assignBelongUser" data-toggle="modal">
              <i class="fas fa-edit"></i>
            </button>
            <button type="button" class="btn btn-sm btn-danger remove-belong-user"
                    th:title="#{page.button.title.unassigned}">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
        <div class="card-body card-default">
          <form method="get" name="searchBelongUser" onsubmit="return false;"
                th:action="@{/companies/__${group.company.id}__/groups/__${group.id}__/users}">
            <input type="hidden" name="isRemoveMode" value="false">
            <div class="row">
              <div class="col-sm-4">
                <div class="form-group">
                  <label th:text="#{page.label.user.loginId}" style="margin-bottom: .1rem">ログインID</label>
                  <input type="text" class="form-control" name="loginId"
                         th:placeholder="#{page.placeholder.user.loginId}">
                </div>
              </div>
              <div class="col-sm-4">
                <div class="form-group">
                  <label th:text="#{page.label.user.name}" style="margin-bottom: .1rem">ユーザー名</label>
                  <input type="text" class="form-control" name="userName"
                       th:placeholder="#{page.placeholder.user.name}">
                </div>
              </div>
            </div>
            <div class="row justify-content-center">
              <button type="button" class="btn btn-primary search-belong-user">
                <i class="fas fa-search"></i>
                <th:block th:text="#{page.button.search}">検索</th:block>
              </button>
            </div>
          </form>
        </div>
        <form method="post" name="removeUser" onsubmit="return false;"
              th:action="@{/companies/__${company.id}__/belong-users/unassigns}"
              th:if="${!#lists.isEmpty(belongUserPage.content)}">
          <div class="card-body card-default">
            <div id="belongUserContent">
              <th:block th:fragment="belongUserContent">
                <th:block th:replace="parts/pagination::pagination(${belongUserPage})"/>
                <table class="table table-striped table-sm assign-belong-user-list"
                       th:fragment="belongUserList">
                  <thead>
                  <tr>
                    <th th:text="#{page.label.user.name}">ユーザー名</th>
                    <th>&nbsp;</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="user : ${belongUserPage.content}">
                    <td>
                      <a th:href="@{/users/__${user.id}__}" th:text="${user.name}">ユーザー名</a>
                    </td>
                    <td class="text-right">
                      <input type="checkbox" class="form-check-input" name="userId"  th:value="${user.id}"
                             th:styleappend="${#bools.isFalse(groupBelongUserSearchForm.isRemoveMode)}?'display: none'">
                    </td>
                  </tr>
                  </tbody>
                </table>
                <th:block th:replace="parts/pagination::pagination(${belongUserPage})"/>
              </th:block>
            </div>
          </div>
          <div class="card-footer  row-unassigned" style="display: none">
            <div class="row">
              <div class="col-8" th:text="#{page.panel.unassigned.message}">
                解除対象を選択してください。
              </div>
              <div class="col-4 text-right">
                <button type="button" class="btn btn-primary remove-belong-user"
                        th:text="#{page.button.unassigned}">解除
                </button>
                <button type="button" class="btn btn-light btn-outline-dark remove-belong-user-cancel"
                        th:text="#{page.button.cancel}">キャンセル
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </section>
  </div>
</div>

<th:block th:replace="companies/groups/modal::edit(${group.company.id}, ${group.id})"></th:block>
<th:block th:replace="companies/groups/modal::confirm(${group.company.id}, ${group.id})"></th:block>
<th:block th:replace="companies/groups/modal::delete(${group.company.id}, ${group.id})"></th:block>
<th:block th:replace="companies/groups/modal::assignBelongUser(${group.company.id}, ${group.id})"></th:block>
<th:block th:replace="parts/template::footer"></th:block>
<th:block th:replace="parts/static::bottom"></th:block>
<script th:src="@{/js/client.js}"></script>
<script th:src="@{/js/detail.js}"></script>
<th:block th:if="${success}">
  <div th:replace="parts/toast::success('page.toast.success.update')"></div>
</th:block>
<th:block th:if="${message}">
  <div th:replace="parts/toast::danger(${message}, ${messageArgs})"></div>
</th:block>
<script type="text/javascript" th:inline="javascript">
    $('.search-not-belong-user').on('click', () => postSearch('searchNotBelongUser', 'notBelongUser'));
    $('.search-belong-user').on('click', () => postSearch('searchBelongUser', 'belongUserContent'));

    $('.btn.btn-primary.assign-belong-user').on('click', () => {
        const form = $('form[name=assignBelongUser]');
        const body = form.serialize();
        const url = form.attr('action');
        const token = form.find('input[name=_csrf]').val();
        let deferred = doPost(url, "application/x-www-form-urlencoded", token, body);
        deferred.done(function (data, response) {
            $("body").append(data);
            $('.search-not-belong-user').trigger('click');
            $('.search-belong-user').trigger('click');
            $('.btn.assign-belong-user').prop('disabled', true);
        });
        deferred.fail(function (data, response) {
            console.error(data);
            window.location.href = "/earthly/error";
        });
    });

    $('.remove-belong-user').on('click', () => {
        showRemoveCard('userId', 'removeBelongUser');
    });

    $('.remove-belong-user-cancel').on('click', () => {
        hideRemoveCard('userId', 'removeBelongUser');
    });

    $('.btn.btn-primary.remove-belong-user').on('click', () => {
        const form = $('form[name=removeBelongUser]');
        const body = form.serialize();
        const url = form.attr('action');
        const token = form.find('input[name=_csrf]').val();
        let deferred = doPost(url, "application/x-www-form-urlencoded", token, body);
        deferred.done(function (data, response) {
            $("body").append(data);
            const searchForm = $('form[name=searchBelongUser]');
            searchForm.find('input').each((i, e) => {
                e.disabled = false;
            });
            $('.search-belong-user').trigger('click');
            searchForm.find('input').each((i, e) => {
                e.disabled = true;
            });
        })
    });

    function activeBelongUserAssignButton() {
        $('.btn.assign-belong-user').prop('disabled', true);
        $('input[name=userId].assign-belong-user').each((i, e) => {
            if (e.checked) {
                $('.btn.assign-belong-user').prop('disabled', false);
            }
        });
    }
</script>
<script th:inline="javascript" th:if="${editModal}">
    $(function () {
        $('#edit').modal('show')
    });
</script>
<script th:inline="javascript" th:if="${readOnly}">
    $(function () {
        $('#confirm').modal('show')
    });
    $('#confirm').on('hidden.bs.modal', function (e) {
        cancel();
    });
</script>
</body>
</html>
