<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="head">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link th:href="@{/img/favicon.ico}" rel="icon" />
  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback" />
  <!-- Font Awesome -->
  <link rel="stylesheet" th:href="@{/vendor/fontawesome-free/css/all.min.css}" />
  <!-- Theme style -->
  <link rel="stylesheet" th:href="@{/vendor/tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.css}" />
  <link rel="stylesheet" th:href="@{/css/adminlte.min.css}" />
  <link rel="stylesheet" th:href="@{/vendor/overlayScrollbars/css/OverlayScrollbars.css}" />
  <link rel="stylesheet" th:href="@{/vendor/select2/css/select2.min.css}" />
  <link rel="stylesheet" th:href="@{/vendor/toastr/toastr.min.css}" />
  <link rel="stylesheet" th:href="@{/css/earthly.css}" />
</th:block>

<th:block th:fragment="bottom">
  <!-- jQuery -->
  <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
  <script th:src="@{/vendor/jquery-ui/jquery-ui.js}"></script>
  <!-- Bootstrap 4 -->
  <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <!-- bs-custom-file-input -->
  <script th:src="@{/vendor/moment/moment.min.js}"></script>
  <script th:src="@{/vendor/daterangepicker/daterangepicker.js}"></script>
  <script th:src="@{/vendor/tempusdominus-bootstrap-4/js/tempusdominus-bootstrap-4.js}"></script>
  <script th:src="@{/vendor/bs-custom-file-input/bs-custom-file-input.min.js}"></script>
  <script th:src="@{/vendor/overlayScrollbars/js/jquery.overlayScrollbars.js}"></script>
  <script th:src="@{/vendor/select2/js/select2.min.js}"></script>
  <script th:src="@{/vendor/toastr/toastr.min.js}"></script>
  <!-- AdminLTE App -->
  <script th:src="@{/js/adminlte.min.js}"></script>
  <script th:inline="javascript">
    toastr.options = {
        "closeButton": true,
        "debug": false,
        "newestOnTop": false,
        "progressBar": false,
        "positionClass": "toast-top-full-width",
        "preventDuplicates": false,
        "onclick": null,
        "showDuration": "300",
        "hideDuration": "1000",
        "timeOut": "5000",
        "extendedTimeOut": "1000",
        "showEasing": "swing",
        "hideEasing": "linear",
        "showMethod": "fadeIn",
        "hideMethod": "fadeOut"
    }
    $('.language,.btn.btn-primary.timezone').on('click', function(e) {
        $('input[name="pathname"]').val(window.location.pathname.replace('/earthly','') + window.location.search);
    });
  </script>
</th:block>
</html>
