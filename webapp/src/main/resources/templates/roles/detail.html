<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Earthly</title>
  <th:block th:replace="parts/static::head"></th:block>
</head>
<body class="sidebar-mini layout-fixed" style="height: auto">
<div class="app-wrapper">
  <th:block th:replace="parts/template::header"></th:block>
  <th:block th:replace="parts/template::navigation"></th:block>

  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 th:text="#{page.title.role.detail}">ロール詳細</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{page.title.home}">Home</a></li>
              <li class="breadcrumb-item"><a th:href="@{/roles}" th:text="#{page.title.role.list}">ロールリスト</a>
              </li>
              <li class="breadcrumb-item active">
                <th:block th:text="${role.name}"/>
              </li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <!-- Default box -->
      <div class="card card-primary card-outline">
        <div class="card-header">
          <h3 class="card-title" th:text="${role.name}">ロール名</h3>
          <div class="card-tools" th:if="${#authentication.getPrincipal().account.permissions.contains(T(jp.co.project.planets.earthly.schema.emuns.PermissionEnum).EDIT_ROLE)}">
            <button type="button" class="btn btn-sm btn-primary edit" th:title="#{page.button.title.edit}"
                    data-target="#edit" data-toggle="modal">
              <i class="fas fa-user-edit"></i>
            </button>
            <button type="button" class="btn btn-sm btn-danger delete" th:title="#{page.button.title.delete}"
                    data-target="#delete" data-toggle="modal">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
        <div class="card-body">
          <div class="row mb-3">
            <div class="col-lg-3 col-md-4 label" th:text="#{page.label.role.description}">概要</div>
            <div class="col-lg-9 col-md-8">
              <th:block th:text="${role.description}">概要</th:block>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-lg-3 col-md-4 label" th:text="#{page.label.role.grantable}">付与有無</div>
            <div class="col-lg-9 col-md-8">
              <th:block th:if="${role.grantable}" th:text="#{page.label.possible}">可能</th:block>
              <th:block th:unless="${role.grantable}" th:text="#{page.label.impossible}">不可能</th:block>
            </div>
          </div>
        </div>
        <!-- /.card-footer-->
      </div>
      <!-- /.card -->
      <hr>

      <!-- 付与ユーザーリスト -->
      <div class="card card-primary card-outline">
        <div class="card-header">
          <h3 class="card-title" th:text="#{page.label.role.assigned.user}">付与ユーザーリスト</h3>
          <div class="card-tools">
            <button type="button" class="btn btn-sm btn-primary add-user"
                    th:title="#{page.button.title.assign}" data-target="#assignUser" data-toggle="modal">
              <i class="fas fa-edit"></i>
            </button>
            <button type="button" class="btn btn-sm btn-danger remove-user"
                    th:title="#{page.button.title.unassigned}">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
        <div class="card-body card-default">
          <form method="get" name="searchGrantedUser" onsubmit="return false;"
                th:action="@{/roles/__${role.id}__/granted-users}">
            <input type="hidden" name="isRemoveMode" value="false">
            <input type="hidden" name="page">
            <div class="row">
              <div class="col-sm-4">
                <div class="form-group">
                  <label th:text="#{page.label.user.loginId}" style="margin-bottom: .1rem">ログインID</label>
                  <input type="text" class="form-control" name="loginId"
                         th:placeholder="#{page.placeholder.company.management.user.loginId}">
                </div>
              </div>
              <div class="col-sm-4">
                <div class="form-group">
                  <label th:text="#{page.label.user.name}" style="margin-bottom: .1rem">ユーザー名</label>
                  <input type="text" class="form-control" name="userName"
                         th:placeholder="#{page.placeholder.user.name}">
                </div>
              </div>
              <div class="col-sm-4">
                <div class="form-group">
                  <label th:text="#{page.label.user.company}" style="margin-bottom: .1rem">所属会社</label>
                  <input type="text" class="form-control" name="userName"
                         th:placeholder="#{page.placeholder.user.company}">
                </div>
              </div>
            </div>
            <div class="row justify-content-center">
              <button type="button" class="btn btn-primary search-granted-user">
                <i class="fas fa-search"></i>
                <th:block th:text="#{page.button.search}">検索</th:block>
              </button>
            </div>
          </form>
        </div>
        <form method="post" name="removeUser" onsubmit="return false;" th:action="@{/roles/__${role.id}__/revoke}">
          <div class="card-body card-default">
            <div id="grantedUserContent">
              <th:block th:fragment="grantedUserContent" th:if="${!#lists.isEmpty(grantedUserPage.content)}">
                <th:block th:replace="parts/pagination::deitalPagination(${grantedUserPage}, 'searchGrantedUser', 'grantedUserContent')"/>
                <table class="table table-striped table-sm assign-user-list"
                       th:fragment="grantedUserList">
                  <thead>
                  <tr>
                    <th th:text="#{page.label.user.name}">ユーザー名</th>
                    <th th:text="#{page.label.user.company}">ユーザー名</th>
                    <th>&nbsp;</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="user : ${grantedUserPage.content}">
                    <td>
                      <a th:href="@{/users/__${user.id}__}" th:text="${user.name}">ユーザー名</a>
                    </td>
                    <td>
                      <a th:href="@{/companies/__${user.company.id}__}" th:text="${user.company.name}">
                        所属会社
                      </a>
                    </td>
                    <td class="text-right">
                      <input type="checkbox" class="form-check-input revoke-user" name="userId" th:value="${user.id}"
                             th:styleappend="${#bools.isFalse(roleGrantedUserSearchForm.isRemoveMode)}?'display: none'"
                             onchange="activeRevokeButton()">
                    </td>
                  </tr>
                  </tbody>
                </table>
                <th:block th:replace="parts/pagination::deitalPagination(${grantedUserPage}, 'searchGrantedUser', 'grantedUserContent')"/>
              </th:block>
            </div>
          </div>
          <div class="card-footer  row-unassigned" style="display: none">
            <div class="row">
              <div class="col-8" th:text="#{page.panel.unassigned.message}">
                解除対象を選択してください。
              </div>
              <div class="col-4 text-right">
                <button type="button" class="btn btn-primary remove-user" th:text="#{page.button.unassigned}">解除
                </button>
                <button type="button" class="btn btn-light btn-outline-dark remove-granted-user-cancel"
                        th:text="#{page.button.cancel}">キャンセル
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
      <hr>

      <!-- パーミッション紐づけ -->
      <div class="card card-primary card-outline">
        <div class="card-header">
          <h3 class="card-title" th:text="#{page.label.role.assigned.permission}">付与パーミッションリスト</h3>
          <div class="card-tools">
            <button type="button" class="btn btn-sm btn-primary add-permission"
                    th:title="#{page.button.title.assign}" data-target="#assignPermission" data-toggle="modal">
              <i class="fas fa-edit"></i>
            </button>
            <button type="button" class="btn btn-sm btn-danger remove-permission"
                    th:title="#{page.button.title.unassigned}">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
        <div class="card-body card-default">
          <form method="get" name="searchAssignedPermission" onsubmit="return false;"
                th:action="@{/roles/__${role.id}__/assigned-permissions}">
            <input type="hidden" name="isRemoveMode" value="false">
            <input type="hidden" name="page">
            <div class="row">
              <div class="col-sm-4">
                <div class="form-group">
                  <label th:text="#{page.label.permission.name}" style="margin-bottom: .1rem">パーミッション名</label>
                  <input type="text" class="form-control" name="permissionName"
                         th:placeholder="#{page.placeholder.permission.name}">
                </div>
              </div>
            </div>
            <div class="row justify-content-center">
              <button type="button" class="btn btn-primary search-assign-user">
                <i class="fas fa-search"></i>
                <th:block th:text="#{page.button.search}">検索</th:block>
              </button>
            </div>
          </form>
        </div>
        <form method="post" name="unassignPermission" onsubmit="return false;"
              th:action="@{/roles/__${role.id}__/unassign-permissions}">
          <div class="card-body card-default">
            <div id="assignPermissionContent">
              <th:block th:fragment="assignPermissionContent" th:if="${!#lists.isEmpty(assignPermissionPage.content)}">
                <th:block th:replace="parts/pagination::deitalPagination(${assignPermissionPage}, 'searchAssignedPermission', 'assignPermissionContent')"/>
                <table class="table table-striped table-sm assign-user-list"
                       th:fragment="assignPermissionList">
                  <thead>
                  <tr>
                    <th th:text="#{page.label.permission.name}">パーミッション名</th>
                    <th>&nbsp;</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="permission : ${assignPermissionPage.content}">
                    <td>
                      <a th:href="@{/systems/permissions/__${permission.id}__}" th:text="${permission.name}">パーミッション名</a>
                    </td>
                    <td class="text-right">
                      <input type="checkbox" class="form-check-input unassign-permission" name="permissionId" th:value="${permission.id}"
                             th:styleappend="${#bools.isFalse(roleAssignedPermissionSearchForm.isRemoveMode)}?'display: none'"
                              onchange="activePermissionUnassignButton()">
                    </td>
                  </tr>
                  </tbody>
                </table>
                <th:block th:replace="parts/pagination::deitalPagination(${assignPermissionPage}, 'searchAssignedPermission', 'assignPermissionContent')"/>
              </th:block>
            </div>
          </div>
          <div class="card-footer  row-unassigned" style="display: none">
            <div class="row">
              <div class="col-8" th:text="#{page.panel.unassigned.message}">
                解除対象を選択してください。
              </div>
              <div class="col-4 text-right">
                <button type="button" class="btn btn-primary remove-permission"
                        th:text="#{page.button.unassigned}">解除
                </button>
                <button type="button" class="btn btn-light btn-outline-dark remove-permission-cancel"
                        th:text="#{page.button.cancel}">キャンセル
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </section>
  </div>
</div>

<th:block th:replace="roles/modal::edit(${role.id})"></th:block>
<th:block th:replace="roles/modal::confirm(${role.id})"></th:block>
<th:block th:replace="roles/modal::delete(${role.id})"></th:block>
<th:block th:replace="roles/modal::assignUser(${role.id})"></th:block>
<th:block th:replace="roles/modal::assignPermission(${role.id})"></th:block>
<div th:replace="parts/timezone::modal"></div>
<th:block th:replace="parts/template::footer"></th:block>
<th:block th:replace="parts/static::bottom"></th:block>
<script th:src="@{/js/client.js}"></script>
<script th:src="@{/js/detail.js}"></script>
<script th:replace="parts/badge::notice"></script>
<div th:replace="parts/timezone::script"></div>
<th:block th:if="${success}">
  <div th:replace="parts/toast::success('page.toast.success.update')"></div>
</th:block>
<th:block th:if="${message}">
  <div th:replace="parts/toast::danger(${message}, ${messageArgs})"></div>
</th:block>
<script type="text/javascript" th:inline="javascript">
    $('.search-granted-user').on('click', () => postSearch('searchGrantedUser', 'grantedUserContent'));
    $('.search-not-grant-user').on('click', () => postSearch('searchNotGrantUser', 'notGrantUserContent'));
    $('.search-assign-user').on('click', () => postSearch('searchAssignedPermission', 'assignPermissionContent'));
    $('.search-unassign-permission').on('click', () => postSearch('searchUnassignedPermission', 'unassignPermissionContent'));

    $('.btn.btn-primary.grant').on('click', () => {
        const form = $('form[name=grantUser]');
        const body = form.serialize();
        const url = form.attr('action');
        const token = form.find('input[name=_csrf]').val();
        let deferred = doPost(url, "application/x-www-form-urlencoded", token, body);
        deferred.done(function (data, response) {
            $("body").append(data);
            $('.search-not-grant-user').trigger('click');
            $('.search-granted-user').trigger('click');
            $('.btn.grant').prop('disabled', true);
        });
        deferred.fail(function (data, response) {
            console.error(data);
            window.location.href = "/earthly/error";
        });
    });

    $('.remove-user').on('click', () => {
        showRemoveCard('userId', 'removeUser');
    });

    $('.remove-granted-user-cancel').on('click', () => {
        hideRemoveCard('userId', 'removeUser');
    });

    $('.btn.btn-primary.remove-user').on('click', () => {
        const form = $('form[name=removeUser]');
        const body = form.serialize();
        const url = form.attr('action');
        const token = form.find('input[name=_csrf]').val();
        let deferred = doPost(url, "application/x-www-form-urlencoded", token, body);
        deferred.done(function (data, response) {
            $("body").append(data);
            const searchForm = $('form[name=searchGrantedUser]');
            searchForm.find('input').each((i, e) => {
                e.disabled = false;
            });
            $('.search-granted-user').trigger('click');
            searchForm.find('input').each((i, e) => {
                e.disabled = true;
            });
        })
    });

    function activeGrantableButton() {
        $('.btn.grant').prop('disabled', true);
        $('input[name=userId].user').each((i, e) => {
            if (e.checked) {
                $('.btn.grant').prop('disabled', false);
            }
        });
    }

    function activeRevokeButton() {
        $('.btn.remove-user').prop('disabled', true);
        $('input[name=userId].revoke-user').each((i, e) => {
            if (e.checked) {
                $('.btn.remove-user').prop('disabled', false);
            }
        });
    }

    $('#assignRole').on('show.bs.modal', () => {
      $('.btn.btn-primary.assign-role').prop('disabled', true);
    });

    function activePermissionAssignButton() {
        $('.btn.assign-permission').prop('disabled', true);
        $('input[name=permissionId].permission').each((i, e) => {
            if (e.checked) {
                $('.btn.assign-permission').prop('disabled', false);
            }
        });
    }

    $('.btn.btn-primary.assign-permission').on('click', () => {
        const form = $('form[name=assignPermission]');
        const body = form.serialize();
        const url = form.attr('action');
        const token = form.find('input[name=_csrf]').val();
        let deferred = doPost(url, "application/x-www-form-urlencoded", token, body);
        deferred.done(function (data, response) {
            $("body").append(data);
            $('.search-unassign-permission').trigger('click');
            $('.search-assign-user').trigger('click');
            $('.btn.assign-permission').prop('disabled', true);
        });
        deferred.fail(function (data, response) {
            console.error(data);
            window.location.href = "/earthly/error";
        });
    });

    $('.remove-permission').on('click', () => {
        showRemoveCard('permissionId', 'unassignPermission');
    });

    $('.remove-permission-cancel').on('click', () => {
        hideRemoveCard('permissionId', 'unassignPermission');
    });

    $('.btn.btn-primary.remove-permission').on('click', () => {
        const form = $('form[name=unassignPermission]');
        const body = form.serialize();
        const url = form.attr('action');
        const token = form.find('input[name=_csrf]').val();
        let deferred = doPost(url, "application/x-www-form-urlencoded", token, body);
        deferred.done(function (data, response) {
            $("body").append(data);
            const searchForm = $('form[name=searchAssignedPermission]');
            searchForm.find('input').each((i, e) => {
                e.disabled = false;
            });
            $('.search-assign-user').trigger('click');
            searchForm.find('input').each((i, e) => {
                e.disabled = true;
            });
        })
    });

    function activePermissionUnassignButton() {
        $('.btn.remove-permission').prop('disabled', true);
        $('input[name=permissionId].unassign-permission').each((i, e) => {
            if (e.checked) {
                $('.btn.remove-permission').prop('disabled', false);
            }
        });
    }

</script>
<script th:inline="javascript" th:if="${editModal}">
    $(function () {
        $('#edit').modal('show')
    });
</script>
<script th:inline="javascript" th:if="${readOnly}">
    $(function () {
        $('#confirm').modal('show')
    });
    $('#confirm').on('hidden.bs.modal', function (e) {
        cancel();
    });
</script>
</body>
</html>
