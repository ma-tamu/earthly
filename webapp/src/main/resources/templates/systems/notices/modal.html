<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- お知らせ登録確認 -->
<div class="modal" id="entry" tabindex="-1" th:fragment="entry">
  <div class="modal-dialog modal-dialog-centered modal-lg entry-confirm-modal">
    <div class="modal-content">
      <form method="post" th:action="@{/systems/notices/create}" th:object="${noticeEntryForm}">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{page.modal.title.notice.confirm.entry}">お知らせ登録確認</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="card-body">
            <div class="row mb-3">
              <label class="col-sm-3 col-form-label" for="name" th:text="#{page.label.notice.title}">件名</label>
              <div class="col-sm-9">
                <th:block th:text="*{title}"></th:block>
              </div>
              <input type="hidden" class="form-control" th:field="*{title}">
            </div>
            <div class="row mb-3">
              <label class="col-sm-3 form-label" th:text="#{page.label.notice.body}">本文</label>
              <div class="col-sm-9">
                <input type="hidden" class="form-control" th:field="*{body}">
                <th:block  th:if="*{body != null}">
                  <th:block th:each="line:*{body.split('\r\n|\r|\n', -1)}">
                    <th:block th:text="${line}">本文</th:block><br />
                  </th:block>
                </th:block>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-3 form-label" th:text="#{page.label.notice.date.start}">掲載開始日</label>
              <div class="col-sm-9" th:if="*{startAt != null}">
                <input type="hidden" class="form-control" name="startAt" th:value="*{#temporals.format(startAt, 'yyyy/MM/dd HH:mm:ss')}">
                <th:block th:text="*{#temporals.format(startAt, 'yyyy/MM/dd HH:mm:ss')}">掲載開始日時</th:block>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-3 form-label" th:text="#{page.label.notice.date.end}">掲載終了日</label>
              <div class="col-sm-9" th:if="*{endAt != null}">
                <input type="hidden" class="form-control" name="endAt" th:value="*{#temporals.format(endAt, 'yyyy/MM/dd HH:mm:ss')}">
                <th:block th:text="*{#temporals.format(endAt, 'yyyy/MM/dd HH:mm:ss')}">掲載終了日時</th:block>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-3 form-label" th:text="#{page.label.notice.emphasis}">付与有無</label>
              <div class="col-sm-9">
                <input type="hidden" class="form-control" name="emphasis" th:value="*{emphasis}">
                <th:block th:if="*{#bools.isTrue(emphasis)}" th:text="#{page.label.yes}">可能</th:block>
                <th:block th:if="*{#bools.isFalse(emphasis)}" th:text="#{page.label.no}">不可能</th:block>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary entry-cancel" data-dismiss="modal"
                  th:text="#{page.button.cancel}">キャンセル
          </button>
          <button type="submit" class="btn btn-primary" th:text="#{page.button.create}">登録</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 登録キャンセル -->
<div th:fragment="cancel" class="modal" id="cancel">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-exclamation-triangle"></i></h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" th:text="#{page.modal.entry.cancel}">
        登録をキャンセルしますか？
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{page.button.back}">Cancel
        </button>
        <a type="button" class="btn btn-primary" th:href="@{/systems/notices}" th:text="#{page.button.ok}">OK</a>
      </div>
    </div>
  </div>
</div>

<!-- ロール編集 -->
<div class="modal" id="edit" tabindex="-1" th:fragment="edit(id)">
  <div class="modal-dialog modal-dialog-centered modal-lg edit-modal">
    <div class="modal-content">
      <form method="post" th:action="@{/systems/notices/__${id}__/edit}" th:object="${noticeEditForm}">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{page.modal.title.notice.edit}">お知らせ編集</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body edit">
          <div class="row mb-3">
            <div class="col-3" th:text="#{page.label.notice.title}">件名</div>
            <div class="col-9">
              <input type="text" class="form-control" id="title"
                     th:classappend="${#fields.hasErrors('title')}?'is-invalid'"
                     th:field="*{title}" oninput="activeSubmitButton()">
              <div class="invalid-feedback" th:errors="*{title}" th:if="${#fields.hasErrors('title')}">
                件名は必須です。
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-3" th:text="#{page.label.notice.body}">本文</div>
            <div class="col-9">
              <textarea type="text" class="form-control" id="body"
                     th:classappend="${#fields.hasErrors('body')}?'is-invalid'"
                        th:field="*{body}" oninput="activeSubmitButton()"></textarea>
              <div class="invalid-feedback" th:errors="*{body}" th:if="${#fields.hasErrors('body')}">
                本文は必須です。
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-3" th:text="#{page.label.notice.date.start}">掲載開始日時</div>
            <div class="col-9">
              <div class="form-group date" id="startAtDatetimepicker" data-target-input="nearest">
                <input type="text" class="form-control datetimepicker-input" data-target="#startAtDatetimepicker"
                       data-toggle="datetimepicker" th:classappend="${#fields.hasErrors('startAt')}?'is-invalid'"
                       th:field="*{startAt}" maxlength="19">
                <div class="invalid-feedback" th:errors="*{startAt}" th:if="${#fields.hasErrors('startAt')}">
                  掲載開始日時は必須です。
                </div>
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-3" th:text="#{page.label.notice.date.end}">掲載終了日時</div>
            <div class="col-9">
              <div class="form-group date" id="endAtDatetimepicker" data-target-input="nearest">
                <input type="text" class="form-control datetimepicker-input" data-target="#endAtDatetimepicker"
                       data-toggle="datetimepicker" th:classappend="${#fields.hasErrors('endAt')}?'is-invalid'"
                       th:field="*{endAt}" maxlength="19">
                <div class="invalid-feedback" th:errors="*{endAt}" th:if="${#fields.hasErrors('endAt')}">
                  掲載終了日時は必須です。
                </div>
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-3" th:text="#{page.label.emphasis.emphasis}">強いお知らせか</div>
            <div class="col-9">
              <div class="form-check">
                <input type="radio" class="form-check-input" id="yes" name="emphasis"
                       th:classappend="${#fields.hasErrors('emphasis')}?'is-invalid'" value="true"
                       th:checked="*{#bools.isTrue(emphasis)}" onclick="activeSubmitButton()">
                <label class="form-check-label" for="yes" th:text="#{page.label.yes}"></label>
              </div>
              <div class="form-check">
                <input type="radio" class="form-check-input" id="no" name="emphasis"
                       th:classappend="${#fields.hasErrors('emphasis')}?'is-invalid'" value="false"
                       th:checked="*{#bools.isFalse(emphasis)}"
                       onclick="activeSubmitButton()">
                <label class="form-check-label" for="no" th:text="#{page.label.no}"></label>
              </div>
              <div class="invalid-feedback" th:errors="*{emphasis}" th:if="${#fields.hasErrors('emphasis')}">
                強いお知らせかは必須です。
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary entry-cancel" data-dismiss="modal"
                  th:text="#{page.button.cancel}">キャンセル
          </button>
          <button type="submit" class="btn btn-primary" th:text="#{page.button.confirm}">確認</button>
        </div>
      </form>
    </div>
  </div>
</div>

              <th:block th:if="*{#bools.isFalse(emphasis)}" th:text="#{page.label.no}">不可能</th:block>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary entry-cancel" data-dismiss="modal"
                  th:text="#{page.button.cancel}">キャンセル
          </button>
          <button type="submit" class="btn btn-primary" th:text="#{page.button.update}">更新</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- お知らせ削除 -->
<div class="modal" id="delete" tabindex="-1" th:fragment="delete(id)">
  <div class="modal-dialog modal-dialog-centered modal-lg delete-modal">
    <div class="modal-content">
      <form method="post" th:action="@{/systems/notices/__${id}__/delete}">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{page.modal.title.notice.delete}">お知らせ削除</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p>削除しますか?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{page.button.cancel}">
            キャンセル
          </button>
          <button type="submit" class="btn btn-primary" th:text="#{page.button.delete}">削除</button>
        </div>
      </form>
    </div>
  </div>
</div>

</html>
