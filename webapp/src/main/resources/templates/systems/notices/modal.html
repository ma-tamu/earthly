<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="modal" id="entryConfirm" tabindex="-1" th:fragment="entryConfirm">
  <div class="modal-dialog modal-dialog-centered modal-lg entry-confirm-modal">
    <div class="modal-content">
      <form method="post" th:action="@{/notices/create}" th:object="${noticeEntryForm}">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{page.modal.title.notice.confirm.entry}">お知らせ登録確認</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="card-body">
            <div class="row">
              <div class="col-6">
                <label class="form-label" for="title" th:text="#{page.label.notice.title}">件名</label>
                <input type="hidden" class="form-control" id="title" th:field="*{title}">
                <th:block th:text="*{title}"></th:block>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <label class="form-label" for="body" th:text="#{page.label.notice.body}">本文</label>
                <input type="hidden" class="form-control" id="body" th:field="*{body}">
                <th:block th:text="*{body}"></th:block>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary entry-cancel" data-bs-dismiss="modal"
                  th:text="#{page.button.cancel}">キャンセル
          </button>
          <button type="submit" class="btn btn-primary" th:text="#{page.button.create}">登録</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 登録キャンセル -->
<div th:fragment="cancel" class="modal" id="cancelModal" tabindex="-1" aria-hidden="true" style="display: none">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="ri-alert-line"></i></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" th:text="#{page.modal.entry.cancel}">
        登録をキャンセルしますか？
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{page.button.back}">Cancel
        </button>
        <a type="button" class="btn btn-primary" th:href="@{/notices}" th:text="#{page.button.ok}">OK</a>
      </div>
    </div>
  </div>
</div>

<!-- ロール編集 -->
<div class="modal" id="edit" tabindex="-1" th:fragment="edit">
  <div class="modal-dialog modal-dialog-centered modal-lg edit-modal">
    <div class="modal-content">
      <form method="post" th:action="@{/roles/edit}" th:object="${roleEditForm}">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{page.modal.title.role.edit}">ロール編集</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="card-body">
            <div class="row mb-3">
              <div class="col-3" th:text="#{page.label.role.name}">ロール名</div>
              <div class="col-9">
                <input type="text" class="form-control" id="name"
                       th:classappend="${#fields.hasErrors('name')}?'is-invalid'"
                       th:field="*{name}" th:readonly="${readOnly}">
                <div class="invalid-feedback" th:errors="*{name}" th:if="${#fields.hasErrors('name')}">
                  会社名は必須です。
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary entry-cancel" data-bs-dismiss="modal"
                  th:text="#{page.button.cancel}">キャンセル
          </button>
          <button type="submit" class="btn btn-primary" th:text="#{page.button.create}">確認</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ロール編集確認 -->
<div class="modal" id="editConfirm" tabindex="-1" th:fragment="editConfirm">
  <div class="modal-dialog modal-dialog-centered modal-lg entry-confirm-modal">
    <div class="modal-content">
      <form method="post" th:action="@{/roles/update}" th:object="${roleEditForm}">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{page.modal.title.role.confirm.edit}">ロール編集確認</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="card-body">
            <div class="row mb-3">
              <div class="col-6">
                <label class="form-label" for="name" th:text="#{page.label.role.name}">ロール名</label>
                <input type="hidden" class="form-control" name="name" th:value="*{name}">
                <th:block th:text="*{name}"></th:block>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary entry-cancel" data-bs-dismiss="modal"
                  th:text="#{page.button.cancel}">キャンセル
          </button>
          <button type="submit" class="btn btn-primary" th:text="#{page.button.update}">更新</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal" id="delete" tabindex="-1" th:fragment="delete(id)">
  <div class="modal-dialog modal-dialog-centered modal-lg delete-modal">
    <div class="modal-content">
      <form th:action="@{/roles/__${id}__/delete}">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{page.modal.title.role.delete}">ロール削除</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>削除しますか?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
          <button type="button" class="btn btn-primary">削除</button>
        </div>
      </form>
    </div>
  </div>
</div>


<div th:fragment="assignUser(id)" class="modal" id="assignUser" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        ユーザー検索
      </div>
      <div class="modal-body">
        <form method="get" name="managementUserSearch" onsubmit="return false;"
              th:action="@{/roles/__${id}__/users}">
          <div class="card">
            <div class="card-body">
              <div class="card-title" th:tel="#{page.modal.title.search}">検索条件</div>
              <div class="row m-1">
                <div class="col-6">
                  <label for="userId" th:text="#{page.label.user.loginId}">ログインID</label>
                  <input type="text" class="form-control" id="userId" name="userId">
                </div>
                <div class="col-6">
                  <label for="userName" th:text="#{page.label.user.name}">ユーザー名</label>
                  <input type="text" class="form-control" id="userName" name="userName">
                </div>
              </div>
              <div class="row m-1">
                <div class="col-6">
                  <label for="company" th:text="#{page.label.user.company}">所属会社</label>
                  <input type="text" class="form-control" id="company" name="company">
                </div>
              </div>
              <div class="row text-center m-1">
                <div class="col-12">
                  <button class="btn btn-primary rounded-pill on-search" type="button">
                    <i class="ri-search-2-line"></i>
                    <th:block th:text="#{page.button.search}">検索</th:block>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
        <form method="post" name="assignManagementUser" th:action="@{/roles/__${id}__/users/assigns}">
          <div class="card role-list">
            <div class="card-body" th:fragment="userSearchResult"
                 th:if="${!unassignedUserPage.isEmpty()}">
              <th:block th:replace="parts/pagination::pagination(${unassignedUserPage})"/>
              <table class="table table-striped table-borderless">
                <thead>
                <tr>
                  <th>ユーザー名</th>
                  <th>&nbsp;</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user:${unassignedUserPage.content}">
                  <td>
                    <a th:href="@{/users/__${user.id}__}"
                       th:text="${user.name}">ユーザー名</a>
                  </td>
                  <td class="text-end">
                    <input class="form-check-input" name="userId" th:value="${user.id}" type="checkbox">
                  </td>
                </tr>
                </tbody>
              </table>
              <th:block th:replace="parts/pagination::pagination(${unassignedUserPage})"/>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary cancel" data-bs-dismiss="modal" type="button">キャンセル</button>
        <button class="btn btn-primary management-user assign" type="button">割り当て</button>
      </div>
    </div>
  </div>
</div>

<!-- パーミッション追加 -->
<div th:fragment="assignPermission(id)" class="modal" id="assignPermission" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        パーミッション検索
      </div>
      <div class="modal-body">
        <form method="get" name="permissionSearch" onsubmit="return false;"
              th:action="@{/roles/__${id}__/permissions}">
          <div class="card">
            <div class="card-body">
              <div class="card-title" th:tel="#{page.modal.title.search}">検索条件</div>
              <div class="row m-1">
                <div class="col-6">
                  <label for="userId" th:text="#{page.label.permission.name}">パーミッション名</label>
                  <input type="text" class="form-control" name="permissionName">
                </div>
              </div>
              <div class="row text-center m-1">
                <div class="col-12">
                  <button class="btn btn-primary rounded-pill on-search" type="button">
                    <i class="ri-search-2-line"></i>
                    <th:block th:text="#{page.button.search}">検索</th:block>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
        <form method="post" name="assignPermission" th:action="@{/roles/__${id}__/permissions/assigns}">
          <div class="card role-list">
            <div class="card-body" th:fragment="userSearchResult"
                 th:if="${!unassignedPermissionPage.isEmpty()}">
              <th:block th:replace="parts/pagination::pagination(${unassignedPermissionPage})"/>
              <table class="table table-striped table-borderless">
                <thead>
                <tr>
                  <th>ユーザー名</th>
                  <th>&nbsp;</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="permission:${unassignedPermissionPage.content}">
                  <td>
                    <a th:href="@{/permissions/__${permission.id}__}"
                       th:text="${permission.name}">ユーザー名</a>
                  </td>
                  <td class="text-end">
                    <input class="form-check-input" name="userId" th:value="${permission.id}" type="checkbox">
                  </td>
                </tr>
                </tbody>
              </table>
              <th:block th:replace="parts/pagination::pagination(${unassignedPermissionPage})"/>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary cancel" data-bs-dismiss="modal" type="button">キャンセル</button>
        <button class="btn btn-primary management-user assign" type="button">割り当て</button>
      </div>
    </div>
  </div>
</div>

</html>
