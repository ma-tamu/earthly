<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Earthly</title>
  <th:block th:replace="parts/static::head"></th:block>
</head>
<body class="sidebar-mini layout-fixed" style="height: auto">
<div class="app-wrapper">
  <th:block th:replace="parts/template::header"></th:block>
  <th:block th:replace="parts/template::navigation"></th:block>

  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 th:text="#{page.title.permission.detail}">パーミッション詳細</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{page.title.home}">Home</a></li>
              <li class="breadcrumb-item"><a th:href="@{/roles}" th:text="#{page.title.permission.list}">パーミッションリスト</a>
              </li>
              <li class="breadcrumb-item active">
                <th:block th:text="${permission.name}"/>
              </li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <!-- Default box -->
      <div class="card card-primary card-outline">
        <div class="card-header">
          <h3 class="card-title" th:text="${permission.name}">ロール名</h3>
        </div>
      </div>
      <!-- /.card -->
      <hr>

      <!-- 紐づけロールリスト -->
      <div class="card card-primary card-outline">
        <div class="card-header">
          <h3 class="card-title" th:text="#{page.label.permission.assigned.role}">ロールリスト</h3>
          <div class="card-tools">
            <button type="button" class="btn btn-sm btn-primary add-role"
                    th:title="#{page.button.title.assign}" data-target="#assignRole" data-toggle="modal">
              <i class="fas fa-edit"></i>
            </button>
            <button type="button" class="btn btn-sm btn-danger remove-role"
                    th:title="#{page.button.title.unassigned}">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
        <div class="card-body card-default">
          <form method="get" name="searchAssignedRole" onsubmit="return false;"
                th:action="@{/systems/permissions/__${permission.id}__/assigned-permissions}">
            <input type="hidden" name="isRemoveMode" value="false">
            <div class="row">
              <div class="col-sm-4">
                <div class="form-group">
                  <label th:text="#{page.label.role.name}" style="margin-bottom: .1rem">ロール名</label>
                  <input type="text" class="form-control" name="roleName" th:placeholder="#{page.placeholder.role.name}">
                </div>
              </div>
            </div>
            <div class="row justify-content-center">
              <button type="button" class="btn btn-primary search-assigned-role">
                <i class="fas fa-search"></i>
                <th:block th:text="#{page.button.search}">検索</th:block>
              </button>
            </div>
          </form>
        </div>
        <form method="post" name="removeRole" onsubmit="return false;"
              th:action="@{/systems/permissions/__${permission.id}__/unassign}">
          <div class="card-body card-default">
            <div id="assignedRoleContent">
              <th:block th:fragment="assignedRoleContent" th:if="${!#lists.isEmpty(assignRolePage.content)}">
                <th:block th:replace="parts/pagination::pagination(${assignRolePage})"/>
                <table class="table table-striped table-sm assign-user-list"
                       th:fragment="assignedRoleList">
                  <thead>
                  <tr>
                    <th th:text="#{page.label.role.name}">ロール名</th>
                    <th>&nbsp;</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="role : ${assignRolePage.content}">
                    <td>
                      <a th:href="@{/roles/__${role.id}__}" th:text="${role.name}">ロール名</a>
                    </td>
                    <td class="text-right">
                      <input type="checkbox" class="form-check-input unassign-role" name="roleId" th:value="${role.id}"
                             th:styleappend="${#bools.isFalse(permissionAssignedRoleSearchForm.isRemoveMode)}?'display: none'"
                             onchange="activeRoleUnassignableButton()">
                    </td>
                  </tr>
                  </tbody>
                </table>
                <th:block th:replace="parts/pagination::pagination(${assignRolePage})"/>
              </th:block>
            </div>
          </div>
          <div class="card-footer  row-unassigned" style="display: none">
            <div class="row">
              <div class="col-8" th:text="#{page.panel.unassigned.message}">
                解除対象を選択してください。
              </div>
              <div class="col-4 text-right">
                <button type="button" class="btn btn-primary remove-unassign-role" th:text="#{page.button.unassigned}">解除
                </button>
                <button type="button" class="btn btn-light btn-outline-dark remove-unassign-role-cancel"
                        th:text="#{page.button.cancel}">キャンセル
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </section>
  </div>
</div>

<th:block th:replace="systems/permissions/modal::assignRole(${permission.id})"></th:block>
<th:block th:replace="parts/template::footer"></th:block>
<th:block th:replace="parts/static::bottom"></th:block>
<script th:src="@{/js/client.js}"></script>
<script th:src="@{/js/detail.js}"></script>
<script th:replace="parts/badge::notice"></script>
<script th:src="@{/js/permission/detail.js}"></script>
<th:block th:if="${success}">
  <div th:replace="parts/toast::success('page.toast.success.update')"></div>
</th:block>
<th:block th:if="${message}">
  <div th:replace="parts/toast::danger(${message}, ${messageArgs})"></div>
</th:block>
</body>
</html>
