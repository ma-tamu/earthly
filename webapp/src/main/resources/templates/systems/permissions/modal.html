<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ユーザー割り当て -->
<div th:fragment="assignRole(id)" class="modal" id="assignRole" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" th:text="#{page.modal.title.role.search}">ロール検索</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form method="get" name="searchUnassignedRole" onsubmit="return false;"
              th:action="@{/systems/permissions/__${id}__/unassigned-roles}">
          <div class="card">
            <div class="card-header">
              <div class="card-title" th:tel="#{page.modal.title.search}">検索条件</div>
            </div>
            <div class="card-body">
              <div class="row m-1">
                <div class="col-6">
                  <label th:text="#{page.label.role.name}" style="margin-bottom: .1rem">ロール名</label>
                  <input type="text" class="form-control form-control-sm" name="roleName">
                </div>
              </div>
              <div class="row text-center">
                <div class="col-12">
                  <button class="btn btn-primary search-unassigned-role" type="button">
                    <i class="fas fa-search"></i>
                    <th:block th:text="#{page.button.search}">検索</th:block>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
        <form name="assignRole" method="post" th:action="@{/systems/permissions/__${id}__/assign}">
          <div id="unassignedRoleContent">
            <th:block th:fragment="unassignedRoleContent" th:if="${!unassignedRolePage.isEmpty()}">
                <th:block th:replace="parts/pagination::pagination(${unassignedRolePage})"/>
                <table class="table table-sm table-striped">
                  <thead>
                  <tr>
                    <th th:text="#{page.label.role.name}">ロール名</th>
                    <th>&nbsp;</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="role:${unassignedRolePage.content}">
                    <td th:text="${role.name}">
                        ロール名
                    </td>
                    <td class="text-right">
                      <input type="checkbox" class="form-check-input role" name="roleId"
                             th:value="${role.id}" onclick="activeAssignableButton()" >
                    </td>
                  </tr>
                  </tbody>
                </table>
                <th:block th:replace="parts/pagination::pagination(${unassignedRolePage})"/>
            </th:block>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary cancel" data-dismiss="modal">キャンセル</button>
        <button type="button" class="btn btn-primary assign-role" disabled="disabled">割り当て</button>
      </div>
    </div>
  </div>
</div>

</html>
