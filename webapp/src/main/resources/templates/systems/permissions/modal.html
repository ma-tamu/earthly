<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- パーミッション削除 -->
<div class="modal" id="delete" tabindex="-1" th:fragment="delete(id)">
  <div class="modal-dialog modal-dialog-centered modal-lg delete-modal">
    <div class="modal-content">
      <form th:action="@{/permissions/__${id}__/delete}">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{page.modal.title.permission.delete}">パーミッション削除</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>削除しますか?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{page.button.cancel}">キャンセル</button>
          <button type="button" class="btn btn-primary" th:text="#{page.button.delete}">削除</button>
        </div>
      </form>
    </div>
  </div>
</div>


<!-- ロール紐づけ -->
<div th:fragment="assignRole(id)" class="modal" id="assignRole" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        ロール検索
      </div>
      <div class="modal-body">
        <form method="get" name="permissionSearch" onsubmit="return false;"
              th:action="@{/permissions/__${id}__/roles}">
          <div class="card">
            <div class="card-body">
              <div class="card-title" th:tel="#{page.modal.title.search}">検索条件</div>
              <div class="row m-1">
                <div class="col-6">
                  <label for="roleName" th:text="#{page.label.role.name}">ロール名</label>
                  <input type="text" class="form-control" id="roleName" name="permissionName">
                </div>
              </div>
              <div class="row text-center m-1">
                <div class="col-12">
                  <button class="btn btn-primary rounded-pill on-search" type="button">
                    <i class="ri-search-2-line"></i>
                    <th:block th:text="#{page.button.search}">検索</th:block>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
        <form method="post" name="assignRole" th:action="@{/permissions/__${id}__/roles/assigns}">
          <div class="card role-list">
            <div class="card-body" th:fragment="roleSearchResult"
                 th:if="${!unassignedRolePage.isEmpty()}">
              <th:block th:replace="parts/pagination::pagination(${unassignedRolePage})"/>
              <table class="table table-striped table-borderless">
                <thead>
                <tr>
                  <th>ロール名</th>
                  <th>&nbsp;</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="role:${unassignedRolePage.content}">
                  <td>
                    <a th:href="@{/roles/__${role.id}__}"
                       th:text="${role.name}">ロール名</a>
                  </td>
                  <td class="text-end">
                    <input class="form-check-input" name="userId" th:value="${role.id}" type="checkbox">
                  </td>
                </tr>
                </tbody>
              </table>
              <th:block th:replace="parts/pagination::pagination(${unassignedRolePage})"/>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary cancel" data-bs-dismiss="modal" th:text="#{page.button.cancel}">キャンセル</button>
        <button type="button" class="btn btn-primary assign" th:text="#{page.button.assign}">割り当て</button>
      </div>
    </div>
  </div>
</div>

</html>
